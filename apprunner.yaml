# AWS App Runner — source-based deployment.
#
# App Runner clones this repository, runs the build commands below on its
# managed Node runtime, and keeps the resulting process alive. No ECR, no
# Dockerfile, no cluster.
#
# The API needs a process that stays up: its risk loop is what keeps collateral
# valuations current, and card authorization fails closed without a fresh
# snapshot. App Runner gives exactly that.
#
# Set the secrets in the App Runner console rather than here — this file is in
# version control. At minimum: DATABASE_URL and CORS_ORIGINS.
version: 1.0
runtime: nodejs22

build:
  commands:
    build:
      # The managed runtime ships npm, not pnpm. Corepack activates the exact
      # version this workspace is pinned to.
      - corepack enable
      - corepack prepare pnpm@9.12.0 --activate
      - pnpm install --frozen-lockfile
      - pnpm exec tsc -b tsconfig.build.json

run:
  runtime-version: 22
  # The server migrates on boot, so this is a single command with no
  # pre-deploy hook to remember.
  command: node apps/api/dist/main.js
  network:
    port: 4000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "4000"
    # Demo endpoints that can move the market for every customer at once, or
    # assert holdings a customer does not have. Off in production regardless;
    # stated here so the intent is explicit.
    - name: ENABLE_SANDBOX_ENDPOINTS
      value: "false"
    - name: RISK_TICK_SECONDS
      value: "20"
    - name: MARKET_TICK_SECONDS
      value: "10"
    - name: LOG_LEVEL
      value: "info"
